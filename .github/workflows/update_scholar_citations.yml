name: Update First-Author Scholar Citations

on:
  schedule:
    - cron: '23 6 * * *'  # daily at 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar-citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Scrape first-author citations
        run: python3 scripts/update_first_author_citations.py

      - name: Commit updated citation data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/json/scholar_first_author.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update first-author Scholar citations"
          git pull --rebase origin master
          git push origin master
